<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitVoice | Clinical Dashboard</title>
    <!-- Tailwind CSS CDN (Awtomatikong maganda ang design, walang custom CSS na kailangan) -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 flex items-center justify-center min-h-screen p-4 m-0">

    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-lg border border-slate-100 text-center">
        <header class="mb-6">
            <h1 class="text-3xl font-extrabold text-blue-900 tracking-tight">🎙️ GitVoice</h1>
            <p class="text-sm text-slate-500 mt-1">Voice-Activated Clinical Assistant for Nurses</p>
        </header>

        <main class="space-y-6">
            <section class="bg-blue-50/50 p-6 rounded-xl border border-blue-100">
                <h2 class="text-lg font-semibold text-slate-700">Ward Voice Command</h2>
                <p class="text-xs text-slate-500 mt-1 mb-6">Tap record to dictate patient logs or clinical notes safely.</p>
                
                <div class="flex flex-col gap-3">
                    <button id="startBtn" onclick="startGitVoiceRecording()" class="w-full bg-red-500 hover:bg-red-600 text-white font-semibold py-3 px-4 rounded-xl shadow-md cursor-pointer transition duration-200 flex items-center justify-center gap-2">
                        🔴 Start Recording
                    </button>
                    <button id="stopBtn" onclick="stopGitVoiceRecording()" disabled class="w-full bg-slate-200 text-slate-400 font-semibold py-3 px-4 rounded-xl cursor-not-allowed transition duration-200">
                        ⏹️ Stop & Process
                    </button>
                </div>

                <div id="statusIndicator" class="mt-6 text-xs font-medium text-slate-600 bg-white p-3 rounded-lg border border-slate-200 shadow-sm">
                    Status: Ready for voice input
                </div>
            </section>

            <!-- Clinical SOAP Note Output Box (Lilitaw pagka-process ng Gemini AI) -->
            <section id="resultSection" class="hidden bg-slate-900 text-slate-100 p-5 rounded-xl text-left shadow-inner">
                <div class="flex justify-between items-center mb-2 border-b border-slate-700 pb-2">
                    <span class="text-xs font-bold uppercase tracking-wider text-emerald-400">📋 Generated SOAP Chart</span>
                    <button onclick="copyChart()" class="text-xs bg-slate-700 hover:bg-slate-600 px-2 py-1 rounded text-white cursor-pointer">Copy</button>
                </div>
                <div id="soapOutput" class="text-xs leading-relaxed whitespace-pre-line font-mono text-slate-200"></div>
            </section>
        </main>
    </div>

    <!-- Scripts -->
    <script src="voice-processor.js"></script>
    <script src="gemini-copilot.js"></script>
</body>
</html>
