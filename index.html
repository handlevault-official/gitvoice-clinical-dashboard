<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitVoice | Clinical Dashboard</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800 flex items-center justify-center min-h-screen p-0 sm:p-4 m-0">

    <!-- Mobile/Tablet App Frame (Parang Native App sa Cellphone) -->
    <div class="bg-white w-full sm:max-w-md min-h-screen sm:min-h-0 sm:rounded-2xl shadow-xl flex flex-col justify-between border border-slate-200 overflow-hidden">
        
        <!-- Top App Bar (Parang Google / Browser Navigation bar sa taas) -->
        <header class="bg-white border-b border-slate-200 px-4 py-3 flex items-center justify-between shadow-sm sticky top-0 z-10">
            <div class="flex items-center gap-2">
                <span class="text-xl">🎙️</span>
                <h1 class="text-base font-extrabold text-blue-900 tracking-tight">GitVoice</h1>
            </div>
            <!-- Top Action Buttons (Reload / Search style) -->
            <div class="flex items-center gap-1">
                <button onclick="location.reload()" title="Reload App" class="p-2 text-slate-600 hover:bg-slate-100 rounded-full cursor-pointer transition text-xs font-medium flex items-center gap-1">
                    🔄 <span class="hidden sm:inline">Reload</span>
                </button>
                <a href="https://github.com/handdlevault-official/handdlevault-official-GitVoice" target="_blank" title="Search / Repository" class="p-2 text-slate-600 hover:bg-slate-100 rounded-full cursor-pointer transition text-xs font-medium flex items-center gap-1">
                    🔍 <span class="hidden sm:inline">Repo</span>
                </a>
            </div>
        </header>

        <!-- Main Content Area -->
        <main class="p-4 sm:p-6 space-y-4 flex-1 overflow-y-auto">
            <!-- Ward Voice Command Section -->
            <section class="bg-blue-50/60 p-5 rounded-xl border border-blue-100 text-center">
                <h2 class="text-base font-semibold text-slate-700">Ward Voice Command</h2>
                <p class="text-xs text-slate-500 mt-1 mb-5">Tap record to dictate patient logs or clinical notes safely.</p>
                
                <div class="flex flex-col gap-3">
                    <button id="startBtn" onclick="startGitVoiceRecording()" class="w-full bg-red-500 hover:bg-red-600 text-white font-semibold py-3 px-4 rounded-xl shadow-md cursor-pointer transition duration-200 flex items-center justify-center gap-2 text-sm">
                        🔴 Start Recording
                    </button>
                    <button id="stopBtn" onclick="stopGitVoiceRecording()" disabled class="w-full bg-slate-200 text-slate-400 font-semibold py-3 px-4 rounded-xl cursor-not-allowed transition duration-200 text-sm">
                        ⏹️ Stop & Process
                    </button>
                </div>

                <div id="statusIndicator" class="mt-4 text-xs font-medium text-slate-600 bg-white p-3 rounded-lg border border-slate-200 shadow-sm">
                    Status: Ready for voice input
                </div>
            </section>

            <!-- Clinical SOAP Note Output Box -->
            <section id="resultSection" class="hidden bg-slate-900 text-slate-100 p-4 rounded-xl text-left shadow-inner">
                <div class="flex justify-between items-center mb-2 border-b border-slate-700 pb-2">
                    <span class="text-xs font-bold uppercase tracking-wider text-emerald-400">📋 Generated SOAP Chart</span>
                    <button onclick="copyChart()" class="text-xs bg-slate-700 hover:bg-slate-600 px-2 py-1 rounded text-white cursor-pointer">Copy</button>
                </div>
                <div id="soapOutput" class="text-xs leading-relaxed whitespace-pre-line font-mono text-slate-200"></div>
            </section>
        </main>

        <!-- Bottom Navigation / Action Bar (Parang Mobile App Bottom Nav sa Baba) -->
        <footer class="bg-white border-t border-slate-200 py-3 px-4 text-xs text-slate-500 flex flex-col sm:flex-row items-center justify-between gap-2">
            <span class="truncate">Managed by <strong class="text-slate-700">handdlevault.official</strong></span>
            <div class="flex items-center gap-3 font-medium">
                <a href="https://ko-fi.com/handdlevaultofficial" target="_blank" class="hover:text-rose-500 transition-colors flex items-center gap-1">
                    ☕ Ko-fi
                </a>
                <span>•</span>
                <a href="https://github.com/sponsors/handdlevault-official" target="_blank" class="hover:text-purple-600 transition-colors flex items-center gap-1">
                    💖 Sponsor
                </a>
            </div>
        </footer>
    </div>

    <!-- Scripts -->
    <script src="voice-processor.js"></script>
    <script src="gemini-copilot.js"></script>
</body>
</html>
